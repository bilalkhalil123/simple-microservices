apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: simple-microservices
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/bilalkhalil123/simple-microservices
    targetRevision: HEAD
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true