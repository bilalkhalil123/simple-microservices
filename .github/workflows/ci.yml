name: CI - Build and Push Docker Images

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push posts image
        uses: docker/build-push-action@v5
        with:
          context: ./posts
          push: true
          tags: muhammadbilal146/posts:latest

      - name: Build and push client image
        uses: docker/build-push-action@v5
        with:
          context: ./client
          push: true
          tags: muhammadbilal146/client:latest

      - name: Update k8s manifests with new image tag
        run: |
          git config --global user.email "github-actions@github.com"
          git config --global user.name "GitHub Actions"
          sed -i "s|muhammadbilal146/posts:.*|muhammadbilal146/posts:${{ github.sha }}|g" k8s/posts-deployment.yaml
          sed -i "s|muhammadbilal146/client:.*|muhammadbilal146/client:${{ github.sha }}|g" k8s/client-deployment.yaml
          git add k8s/
          git commit -m "Update image tags to ${{ github.sha }}" || echo "No changes"
          git push
